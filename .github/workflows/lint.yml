name: Lint

on:
  push:
  pull_request:

jobs:
  simple-english:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install simple_english
        run: gem install simple_english -v 0.13.0
      - name: Lint markdown and code comments
        run: se lint .
